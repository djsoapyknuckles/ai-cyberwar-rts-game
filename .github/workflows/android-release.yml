# Android release: builds the APK and attaches it to a GitHub Release.
# Runs when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0),
# or by hand from the Actions tab (builds the APK as a workflow artifact, no release).
# Pull requests that touch the Android build also build the APK (no release) to catch breakage.
#
# Signing (optional, see MOBILE.md): with these repository secrets set, the release APK
# is signed with your key; without them the job ships a debug-signed APK instead.
#   ANDROID_KEYSTORE_BASE64   base64 of the .jks file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
name: Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths: ['android/**', 'capacitor.config.json', '.github/workflows/android-release.yml']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run android:sync

      - name: Version from tag
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then name="${GITHUB_REF_NAME#v}"; else name="0.0.0-dev.$GITHUB_RUN_NUMBER"; fi
          echo "ANDROID_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "APK_NAME=ai-cyberwar-$name.apk" >> "$GITHUB_ENV"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: shipping a debug-signed APK."
          fi

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [[ -n "$ANDROID_KEYSTORE_PATH" ]]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/$APK_NAME"
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/$APK_NAME"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK_NAME" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
